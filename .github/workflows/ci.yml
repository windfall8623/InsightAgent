name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv pip install --system -e ".[api,dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check (strict)
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

      - name: Evaluation (regression gate)
        # Fails if any evaluation case regresses, so a code change that breaks
        # agent behaviour cannot merge unnoticed.
        run: uv run eval

      - name: Docker build
        run: docker build -t insight-agent:ci .
