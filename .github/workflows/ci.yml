name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Core Architecture & CN-Retail Tests
        run: uv run pytest tests/test_p1_upgrades.py tests/test_p2_upgrades.py tests/test_p3_unified_architecture.py tests/test_p4_upgrades.py tests/test_p5_upgrades.py tests/test_cn_retail.py -q
