<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑自行车 2D SVG 动画预览</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #1e293b, #0f172a);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      color: #f1f5f9;
      padding: 24px;
    }
    .header {
      margin-bottom: 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .header p {
      font-size: 14px;
      color: #94a3b8;
    }
    .container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 1000 / 680;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container img, .container svg {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🚴‍♂️ 鹈鹕破风骑行 · 2D SVG 纯矢量动画</h1>
    <p>全自包含 CSS 关键帧驱动 · 踏板连杆拟真 · 巨型喉囊Q弹果冻动画 · 迎风飘扬领巾</p>
  </div>
  <div class="container">
    <object type="image/svg+xml" data="pelican_bicycle.svg" width="100%" height="100%"></object>
  </div>
</body>
</html>
