[project]
name = "insight-agent"
version = "0.2.0"
description = "A multi-agent natural-language analytics system for e-commerce data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "qdrant-client>=1.19.1",
    "redis>=5.0.0",
    "langgraph>=0.2.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

# Live planner backends. Each is optional: the project runs without either.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]

# Everything needed to run and deploy the service.
full = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "openai>=1.40",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "python-dotenv>=1.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
insight = "insight_agent.cli:main"
insight-mcp = "insight_agent.app.mcp_server:main"
insight-api = "insight_agent.api:get_app"
eval = "insight_agent.eval.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insight_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]


[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
# Strict checking covers the shipped package. Tests are deliberately excluded:
# they are annotated loosely for readability, and pytest fixtures make fully
# typed test signatures noisy without buying extra safety.
files = ["src"]

[[tool.mypy.overrides]]
module = "fastapi.*"
ignore_missing_imports = true

# Optional extra, imported lazily inside a try/except at runtime.
[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*", "openai", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
